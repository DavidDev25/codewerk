<style>
  form { display: grid; gap: 8px; max-width: 320px; }
  label { display: grid; gap: 2px; font-weight: 600; }
  input, select, button { font: inherit; padding: 6px; }
  #meldung.fehler { color: #b3261e; font-weight: 600; }
  #meldung.ok { color: #1e6b3a; font-weight: 600; }
</style>
<h1>Anmeldung zum Kurs</h1>
<form id="anmeldung">
  <label>Name <input name="name" autocomplete="name"></label>
  <label>E-Mail <input name="email" autocomplete="email"></label>
  <label>Kurs
    <select name="kurs">
      <option>JavaScript</option>
      <option>HTML &amp; CSS</option>
      <option>React</option>
    </select>
  </label>
  <button type="submit">Anmelden</button>
</form>
<p id="meldung" role="status"></p>
<h2>Teilnehmer</h2>
<ul id="teilnehmer"></ul>
